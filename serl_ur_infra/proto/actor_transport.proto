syntax = "proto3";

// Keep the original service name so v1 peers can reach GetServerInfo and
// receive an explicit protocol-version error.  The request/reply contract
// itself is v2 and rejects protocol_version="1".
package gello.hil_serl.v1;

// Unary actor boundary between the robot laptop and the RL server.
//
// The laptop sends each observation exactly once: O0 in BeginEpisode, then
// O(t+1) together with transition D(t) in Step. The server acknowledges D(t)
// and, for non-terminal steps, returns the policy action for O(t+1).
service ActorTransport {
  rpc Health(HealthRequest) returns (HealthReply);
  rpc GetServerInfo(ServerInfoRequest) returns (ServerInfoReply);
  rpc GetBufferStatus(BufferStatusRequest) returns (BufferStatusReply);
  rpc BeginEpisode(BeginEpisodeRequest) returns (ActionReply);
  rpc Step(StepRequest) returns (StepReply);
}

message HealthRequest {}

message HealthReply {
  bool alive = 1;
  bool ready = 2;
  string detail = 3;
}

message ServerInfoRequest {}

message ServerInfoReply {
  bool ready = 1;
  string protocol_version = 2;
  uint32 schema_version = 3;
  uint32 action_dim = 4;
  string model_id = 5;
  string reward_authority = 6;
  string reward_model_id = 7;
  string observation_schema_hash = 8;
}

message BufferStatusRequest {
  string protocol_version = 1;
}

// Summary-only replay ingress status.  Raw observations and actions are never
// returned by this RPC.
message BufferStatusReply {
  string protocol_version = 1;
  uint32 schema_version = 2;
  uint64 replay_size = 3;
  uint64 replay_capacity = 4;
  uint64 intervention_size = 5;
  uint64 intervention_capacity = 6;
  uint64 replay_insert_count = 7;
  uint64 intervention_insert_count = 8;
  uint64 replay_overwrite_count = 9;
  uint64 intervention_overwrite_count = 10;
  string last_transition_id = 11;
  uint64 last_env_step = 12;
  bool has_last_transition = 13;
}

// One leaf from a nested observation mapping. `path` retains the exact mapping
// keys while dtype/shape/raw bytes provide a lossless numpy round trip.
message Tensor {
  repeated string path = 1;
  string dtype = 2;
  repeated uint64 shape = 3;
  bytes data = 4;
}

message Observation {
  string observation_id = 1;
  uint64 timestamp_ns = 2;
  repeated Tensor tensors = 3;
}

message BeginEpisodeRequest {
  string protocol_version = 1;
  string actor_id = 2;
  string run_id = 3;
  string session_id = 4;
  uint64 episode_id = 5;
  uint64 request_id = 6;
  uint64 created_monotonic_ns = 7;
  Observation observation = 8;
  bool deterministic = 9;
}

message Meta {
  uint32 schema_version = 1;
  string run_id = 2;
  string actor_id = 3;
  string session_id = 4;
  string transition_id = 5;
  uint64 env_step = 6;
  uint64 timestamp_ns = 7;
  uint64 policy_version = 8;
  repeated float policy_action = 9;
  bool intervened = 10;
  // Reward-mode snapshot selected by the operator for this transition.
  // auto_success=false is MANUAL; true enables classifier success authority.
  bool auto_success = 11;
  // One-shot GUI success assertion.  It is invalid while auto_success=true.
  bool operator_success = 12;
}

message Transition {
  uint64 episode_id = 1;
  uint64 step_id = 2;
  string observation_id = 3;
  repeated float actions = 4;
  string next_observation_id = 5;
  double rewards = 6;
  double masks = 7;
  bool dones = 8;
  bool truncated = 9;
  bool has_grasp_penalty = 10;
  double grasp_penalty = 11;
}

message Data {
  Meta meta = 1;
  Transition transition = 2;
}

message StepRequest {
  string protocol_version = 1;
  string actor_id = 2;
  string run_id = 3;
  string session_id = 4;
  uint64 request_id = 5;
  uint64 created_monotonic_ns = 6;
  Data data = 7;
  Observation next_observation = 8;
  bool request_action = 9;
  bool deterministic = 10;
}

message Ack {
  bool accepted = 1;
  string transition_id = 2;
  string session_id = 3;
  uint64 request_id = 4;
  bool deduplicated = 5;
  string error = 6;
}

message ActionReply {
  bool ok = 1;
  string error = 2;
  string protocol_version = 3;
  string session_id = 4;
  uint64 request_id = 5;
  uint64 request_created_monotonic_ns = 6;
  string observation_id = 7;
  repeated float action = 8;
  uint64 policy_version = 9;
  double server_inference_ms = 10;
}

// The server-authoritative values that were inserted into replay.  Classifier
// scalars are zero when classifier_evaluated is false.
message TransitionOutcome {
  string transition_id = 1;
  double reward = 2;
  double mask = 3;
  bool done = 4;
  bool truncated = 5;
  bool success = 6;
  bool classifier_evaluated = 7;
  double classifier_probability = 8;
  double classifier_threshold = 9;
  string reward_model_id = 10;
}

message StepReply {
  Ack ack = 1;
  bool has_action = 2;
  ActionReply action = 3;
  TransitionOutcome outcome = 4;
}
