# RWH GELLO -> Franka Panda MuJoCo sim teleop config.
# Calibration values reused from 조민제's Docker image
# (minje227/gello:RWH_Gello_PandaV1.0, /gello/configs/rwh_panda.yaml) — SAME physical
# GELLO (port FTBEO75A, XL330 servos, motor IDs 1-7 arm + 8 gripper). No re-calibration
# needed unless the GELLO assembly/servo mounting changes.
#
# SAFETY: GELLO is used READ-ONLY (passive leader). DynamixelRobot inits with torque
# disabled; commands flow only to the sim robot, never to the GELLO motors.
#
# Gripper: panda.xml bundles the hand (actuator8, ctrlrange [0,255]) rather than a
# separate gripper_xml, so we set gripper_builtin:true to rescale the GELLO [0,1]
# gripper command to the actuator range. The 7 arm joints teleop in radians 1:1.

robot:
  _target_: gello.robots.sim_robot.MujocoRobotServer
  xml_path: "third_party/mujoco_menagerie/franka_emika_panda/panda.xml"
  gripper_xml_path: null
  gripper_builtin: true   # panda.xml bundles the hand: rescale GELLO [0,1] -> actuator8 [0,255]
  gripper_invert: true    # panda actuator8 255=open; invert so pulling the GELLO lever closes
  add_scene: true         # add checker floor + skybox + lighting (opt-in; no effect on nu)
  add_cube: true          # add a small red cube on the floor in front of the panda (+x)
  stable_grasp: true      # elliptic cone + impratio + noslip + finer timestep so grasps don't slip
  host: "127.0.0.1"
  port: 6001

agent:
  _target_: gello.agents.gello_agent.GelloAgent
  port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTBEO75A-if00-port0"
  dynamixel_config:
    _target_: gello.agents.gello_agent.DynamixelRobotConfig
    joint_ids: [1, 2, 3, 4, 5, 6, 7]
    joint_offsets: [4.712, 3.142, 3.142, 3.142, 0.0, 3.142, 3.142]
    joint_signs: [1, -1, 1, -1, 1, -1, 1]
    gripper_config: [8, 115.376171875, 73.576171875]
  start_joints: [0.0, 0.0, 0.0, -1.57, 0.0, 1.57, 0.0, 1.0]

hz: 30
