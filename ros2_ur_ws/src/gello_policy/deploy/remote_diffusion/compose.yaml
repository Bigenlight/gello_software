services:
  diffusion-server:
    build:
      # Compose resolves this relative to this file. Keep the build context at the
      # gello_policy package so the large repository and checkpoints are excluded.
      context: ../..
      dockerfile: deploy/remote_diffusion/Dockerfile
    image: gello-remote-diffusion:${IMAGE_TAG:-dev}
    container_name: ${CONTAINER_NAME:-gello-remote-diffusion}
    init: true
    # Shared GPU host: never reclaim the previously selected GPU automatically
    # after a daemon/host restart. An operator must inspect occupancy and start it.
    restart: "no"
    ports:
      # Loopback-only by default: the laptop reaches it through an SSH tunnel.
      # Set INFERENCE_BIND_IP only when a private firewall/VPN is in place.
      - "${INFERENCE_BIND_IP:-127.0.0.1}:${INFERENCE_PORT:-50051}:50051"
    environment:
      CHECKPOINT_PATH: /models/checkpoint
      MODEL_ID: ${MODEL_ID:-Bigenlight/diffusion_banana_in_pot_joint}
      CHECKPOINT_REVISION: ${CHECKPOINT_REVISION:-unknown}
      GRPC_BIND_ADDRESS: 0.0.0.0:50051
      DIFFUSION_DEVICE: cuda
      DIFFUSION_SCHEDULER: ${DIFFUSION_SCHEDULER:-DDIM}
      DIFFUSION_NUM_INFERENCE_STEPS: ${DIFFUSION_NUM_INFERENCE_STEPS:-10}
      DIFFUSION_N_ACTION_STEPS: ${DIFFUSION_N_ACTION_STEPS:-32}
    volumes:
      - "${CHECKPOINT_DIR:?Set CHECKPOINT_DIR to the pretrained_model directory}:/models/checkpoint:ro"
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Select a physical GPU on every run, e.g. GPU_DEVICE=3.
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777

  # Policy-class-independent alternative. Start explicitly with:
  #   docker compose --profile generic up policy-server
  policy-server:
    profiles: ["generic"]
    build:
      context: ../..
      dockerfile: deploy/remote_diffusion/Dockerfile
      args:
        LEROBOT_COMMIT: ${LEROBOT_COMMIT:-8a74e0ac6d01706d67fddfed682a09d694d9c8c0}
        LEROBOT_EXTRAS: ${LEROBOT_EXTRAS:-multi-task-dit}
        # Match the environment that produced the deployed checkpoint. These
        # args intentionally apply only to the generic policy image.
        TRANSFORMERS_VERSION: ${TRANSFORMERS_VERSION:-5.13.0}
        HUGGINGFACE_HUB_VERSION: ${HUGGINGFACE_HUB_VERSION:-1.22.0}
    image: gello-remote-policy:${IMAGE_TAG:-dev}
    container_name: ${POLICY_CONTAINER_NAME:-gello-remote-policy}
    init: true
    restart: "no"
    entrypoint: ["python", "-m", "policy_server.remote_lerobot_server"]
    ports:
      - "${INFERENCE_BIND_IP:-127.0.0.1}:${POLICY_INFERENCE_PORT:-50052}:50051"
    environment:
      CHECKPOINT_PATH: /models/checkpoint
      # Keep interpolation optional so the inactive generic profile cannot
      # break the proven diffusion-server deployment. The generic entrypoint
      # itself rejects either value when blank, before loading the checkpoint.
      EXPECTED_POLICY_TYPE: ${EXPECTED_POLICY_TYPE:-}
      EXPECTED_CHECKPOINT_REVISION: ${EXPECTED_CHECKPOINT_REVISION:-}
      GRPC_BIND_ADDRESS: 0.0.0.0:50051
      POLICY_DEVICE: cuda
      POLICY_TASK: ${POLICY_TASK:-}
      POLICY_TASK_MODE: ${POLICY_TASK_MODE:-auto}
      POLICY_WARMUP_STATE: '${POLICY_WARMUP_STATE:-[3.106,-1.817,1.653,-1.618,-1.628,-3.195,0.0]}'
      POLICY_CONFIG_OVERRIDES: '${POLICY_CONFIG_OVERRIDES:-{}}'
      EXTERNAL_IMAGE_SIZE: ${EXTERNAL_IMAGE_SIZE:-auto}
      GRPC_MAX_MESSAGE_BYTES: ${GRPC_MAX_MESSAGE_BYTES:-16777216}
      MAX_JPEG_BYTES: ${MAX_JPEG_BYTES:-4194304}
      HF_HOME: /cache/huggingface
      # The server runs offline and does not need a Hugging Face credential.
      # Point token discovery at an absent tmpfs path as defense in depth.
      HF_TOKEN_PATH: /tmp/huggingface-token-disabled
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - "${CHECKPOINT_DIR:?Set CHECKPOINT_DIR to the pretrained_model directory}:/models/checkpoint:ro"
      # Mount only Hub model data, not the host HF root. In particular, never
      # expose the host token file to the unprivileged offline container.
      - "${HF_CACHE_DIR:-./hf-cache}/hub:/cache/huggingface/hub:ro"
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
