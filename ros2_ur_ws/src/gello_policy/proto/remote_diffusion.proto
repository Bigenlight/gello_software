syntax = "proto3";

package gello.remote_diffusion.v1;

// Remote inference boundary between the robot laptop and the GPU server.
//
// The laptop owns cameras, robot feedback, all safety checks, and robot control.
// The GPU server only transforms one observation into one 7-D joint action.
service RemoteDiffusion {
  // Lightweight liveness check. This does not prove that the model is loaded.
  rpc Health(HealthRequest) returns (HealthReply);

  // Reports the effective model/runtime contract after CUDA warm-up.
  rpc GetServerInfo(ServerInfoRequest) returns (ServerInfoReply);

  // Clears the policy observation/action queues before an operator-authorized run.
  rpc ResetEpisode(ResetEpisodeRequest) returns (ResetEpisodeReply);

  // Persistent observation/action channel. The client initially permits only one
  // in-flight request so stale observations cannot accumulate in a hidden queue.
  rpc StreamActions(stream ObservationRequest) returns (stream ActionReply);
}

message HealthRequest {}

message HealthReply {
  bool alive = 1;
  bool ready = 2;
  string detail = 3;
}

message ServerInfoRequest {}

message ServerInfoReply {
  bool ready = 1;
  string protocol_version = 2;
  string model_id = 3;
  string checkpoint_revision = 4;
  string scheduler = 5;
  uint32 num_inference_steps = 6;
  uint32 n_action_steps = 7;
  uint32 state_dim = 8;
  uint32 action_dim = 9;
  string device = 10;
  uint32 resize_height = 11;
  uint32 resize_width = 12;
}

message ResetEpisodeRequest {
  string client_id = 1;
  string session_id = 2;
}

message ResetEpisodeReply {
  bool ok = 1;
  string detail = 2;
}

message ImageFrame {
  // Original ROS header timestamp for cross-camera skew validation.
  uint64 ros_stamp_ns = 1;
  string encoding = 2;  // Must be "jpeg" in protocol v1.
  uint32 width = 3;
  uint32 height = 4;
  bytes data = 5;
}

message ObservationRequest {
  string protocol_version = 1;
  string client_id = 2;
  string session_id = 3;
  uint64 request_id = 4;

  // Laptop monotonic capture time. It is meaningful only when echoed back and
  // compared on the laptop; clocks on the two machines need not be synchronized.
  uint64 created_monotonic_ns = 5;

  // UR q1..q6 in radians followed by gripper position in [0, 1].
  repeated float state = 6;
  ImageFrame cam1 = 7;
  ImageFrame cam2 = 8;
}

message ActionReply {
  string protocol_version = 1;
  string session_id = 2;
  uint64 request_id = 3;

  // UR q1..q6 in radians followed by gripper command in [0, 1].
  repeated float action = 4;

  double preprocess_ms = 5;
  double inference_ms = 6;
  double total_server_ms = 7;
  bool chunk_refill = 8;
  uint32 remaining_chunk_actions = 9;

  // A failed reply never contains a usable action.
  bool ok = 10;
  string error = 11;
}
