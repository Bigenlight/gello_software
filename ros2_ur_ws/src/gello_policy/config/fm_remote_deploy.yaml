# fm_remote_deploy.yaml — Kanu gRPC Flow-Matching real-robot deployment.
#
# FM (multi_task_dit, objective=flow_matching) variant using the common LeRobot
# gRPC policy server on Kanu. The joint model emits the same 7-D action contract,
# so the ROS2 safety stack is reused unchanged. The laptop sends
# state[7]+cam1+cam2 through an SSH-forwarded gRPC endpoint.
#
# TIMEOUTS: an FM net-refill runs a full Euler-ODE integration loop (num_integration_steps
# passes through the DiT + CLIP encoders), comparable to / slower than a diffusion DDIM refill.
# We keep the diffusion deploy's WIDENED timeouts. Ordering invariant preserved:
# act_timeout_s < obs_timeout_s < staleness_timeout_s (0.6 < 0.7 < 0.8), so
# the leader's inference timeout is the clean primary fault owner.
#
# >>> If a measured p99 refill latency exceeds the budget, REDUCE the server's
# FM_NUM_INTEGRATION_STEPS (e.g. 10) rather than widening these timeouts further — fewer
# Euler steps is the correct knob to make refills fit the bridge budget.

# ---------------------------------------------------------------------------- #
# Synthetic leader (this package). Policy-agnostic; see gello_policy README.
# ---------------------------------------------------------------------------- #
policy_leader_node:
  ros__parameters:
    # The robot laptop sends state[7]+cam1+cam2 through the SSH-forwarded gRPC
    # endpoint and receives action[7]. The server reports the actual checkpoint
    # manifest identity. Compute the revision before startup with
    # `python3 -m policy_server.checkpoint_identity "$CHECKPOINT_DIR"`.
    inference_transport: "grpc"
    grpc_port: 50052
    expected_model_id: "multi_task_dit"
    expected_checkpoint_revision: "REPLACE_WITH_SHA256_MANIFEST"
    expected_scheduler: "multi_task_dit:flow_matching"
    expected_inference_steps: 10
    expected_action_steps: 24
    expected_resize_height: 0
    expected_resize_width: 0

    # Single rclpy timer rate driving BOTH /gello/joint_states and the gripper
    # command each tick (matches the recorder / dataset control rate).
    publish_rate_hz: 30.0

    # HELD start pose (rad, UR joint order: pan, lift, elbow, w1, w2, w3). While in
    # HOLD the leader publishes THIS pose perfectly still so gello_move_to_start
    # converges on it and the resume-align gate passes. This is the dataset's start
    # pose; the live arm must be within ~0.1 rad of it before ~/start_execution is
    # accepted.
    start_pose: [3.106, -1.817, 1.653, -1.618, -1.628, -3.195]
    # Held gripper command while in HOLD (0.0 = OPEN .. 1.0 = CLOSED).
    start_gripper: 0.0

    # SSH-forwarded gRPC endpoint. act_host/act_port are retained as common
    # transport parameters used by the policy leader.
    act_host: "127.0.0.1"
    act_port: 50052
    # gRPC inference timeout (s). On timeout/error the node FAULTS: it STOPS
    # publishing /gello/joint_states so the bridge's staleness watchdog trips and
    # halts the arm (never hold-last-target through an outage).
    act_timeout_s: 0.6  # FM refill (Euler ODE) is slower than an ACT forward; the leader tolerates
                        # it before FAULT and stays the PRIMARY fault owner (faults first, cleanly).

    # SAFETY CLAMP (a): per-joint hard limits = the 1.2x dataset envelope
    # (see config/joint_safety_limits.json). Any commanded joint outside this is
    # clipped (OOD guard). Order = UR joint order (pan, lift, elbow, w1, w2, w3).
    joint_limits_lo: [2.40, -2.53, 1.05, -3.34, -2.18, -5.22]
    joint_limits_hi: [3.67, -0.88, 2.62, -1.01, -1.25, -1.52]

    # SAFETY CLAMP (b): per-joint max deviation (rad) of a commanded target from the
    # LIVE /joint_states. Bounds any single-step jump from the actual pose.
    max_dev_rad: 0.5

    # OBS FRESHNESS WATCHDOG: in EXECUTE, if any observation (joint_states, grip_pos,
    # cam1, cam2) is missing or older than this many seconds, the node FAULTs (stops
    # publishing -> bridge halts the arm). Catches a frozen/hung camera driving the
    # policy on a stale frame.
    # Kept ABOVE act_timeout_s: the node is single-threaded, so during a refill tick it
    # BLOCKS inside the gRPC round-trip and cannot service camera callbacks -> obs
    # timestamps freeze for the refill duration. Keeping obs_timeout_s (0.7) above
    # act_timeout_s (0.6) makes the inference timeout the primary fault owner while a
    # genuinely frozen camera is still caught (0.2 s later).
    obs_timeout_s: 0.7

    # If true, auto-enter EXECUTE when /forward_position_controller/commands starts
    # streaming (i.e. the bridge released), instead of waiting for the operator's
    # ~/start_execution call. Default false = operator-gated start (safer).
    auto_start_on_stream: false

# ---------------------------------------------------------------------------- #
# GELLO -> UR bridge. REUSED from ur7e_gello.yaml. ONLY the two one-euro knobs are
# changed (opened up) for the policy; every safety-relevant value is IDENTICAL.
# ---------------------------------------------------------------------------- #
gello_ur_bridge:
  ros__parameters:
    filter_type: "one_euro"
    # OPENED UP for the policy (was 1.0). The policy emits a smooth, already-filtered
    # target stream at 30 Hz; a low min_cutoff only adds at-rest lag.
    one_euro_min_cutoff: 3.0
    # OPENED UP for the policy (was 2.0). Higher beta => cutoff opens faster with speed
    # => snappier tracking of the policy's intended motion.
    one_euro_beta: 4.0
    one_euro_d_cutoff: 1.0
    ema_alpha: 0.4
    # UNCHANGED (safety): per-cycle slew ceiling. 0.0025 rad @ 250 Hz => 0.625 rad/s
    # sustained, worst-case two-coalesce 2.5 rad/s (~20% margin under the 3.14 rad/s
    # driver limit). Do NOT raise.
    max_step_rad: 0.0025
    deadband_rad: 0.004
    # Kept ABOVE act_timeout_s (0.6) so the bridge does NOT halt during a legitimate
    # <=0.6s FM refill gap while the leader blocks on gRPC. The leader (0.6s) faults
    # FIRST and cleanly on a real outage. Ordering: act_timeout_s (0.6) < staleness (0.8).
    staleness_timeout_s: 0.8
    # UNCHANGED (safety): soft-start ease-in on every (re)seed.
    soft_start_s: 0.7
    start_paused: false
    # UNCHANGED (safety): resume alignment gate; MUST stay >= chase_tol (0.06).
    resume_align_tol: 0.08
    # UNCHANGED: 250 Hz upsample of the 30 Hz leader stream into the 500 Hz driver.
    publish_rate_hz: 250.0
    joint_states_topic: "/joint_states"

# ---------------------------------------------------------------------------- #
# move-to-start handshake. Copied VERBATIM from ur7e_gello.yaml. The handshake
# chases the pose the leader HOLDS (= policy_leader_node.start_pose) and hands over.
# ---------------------------------------------------------------------------- #
gello_move_to_start:
  ros__parameters:
    source_controller: "scaled_joint_trajectory_controller"
    target_controller: "forward_position_controller"
    trajectory_duration: 5.0
    arrival_tolerance: 0.05
    chase_tol: 0.06
    chase_dwell_s: 0.4
    chase_v_budget: 0.5
    min_traj_duration: 0.5
    chase_hard_limit: 4.0
    chase_still_speed: 0.1
    chase_still_window_s: 0.3
    chase_timeout_s: 30.0
    gello_staleness_s: 0.5
    start_mode: "gello"
    init_pose: [1.5708, -1.57, 1.57, -1.57, -1.57, 0.0]
    alignment_tolerance: 0.2
    alignment_hard_limit: 0.5
    alignment_timeout: 0.0

# ---------------------------------------------------------------------------- #
# Robotiq 2F-85 Modbus gripper driver (node name 'robotiq_gripper').
# Copied VERBATIM from ur7e_gello.yaml. serial_port default "" is overridden to
# /tmp/ttyUR by the launch (arm driver owns the tool bus via use_tool_communication).
# ---------------------------------------------------------------------------- #
robotiq_gripper:
  ros__parameters:
    serial_port: ""
    speed: 150
    force: 50
    connect_on_start: true
    activate_on_connect: true
    status_rate_hz: 5.0
    command_rate_hz: 20.0
    command_deadband: 0.01
