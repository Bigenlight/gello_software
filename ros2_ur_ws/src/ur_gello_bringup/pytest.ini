[pytest]
# The ROS 2 (Jazzy) environment registers pytest11 plugins (launch_testing,
# launch_ros, launch_pytest) whose import chain pulls in `launch`, which needs
# `lark`. `lark` is not installed in this venv, so plugin autoload crashes
# collection for EVERY test — including the pure-math ur_kin tests, which use
# only numpy and never touch ROS. We disable those three launch plugins here so
# `python -m pytest test/ -q` runs cleanly. (Re-check on the real robot PC: if
# lark is installed there, these lines are harmless no-ops.)
addopts = -p no:launch_testing -p no:launch_ros -p no:launch_pytest
testpaths = test
