# ur7e_gello.yaml — parameter file for the GELLO -> UR7e teleop pipeline.
#
# Same physical GELLO leader as the ur5e setup (FTDI serial FTBEO6QK).
# The CALIBRATION block below is REUSED VERBATIM from config/ur_gello.yaml —
# NO recalibration is needed: the leader hardware is unchanged, and ur5e/ur7e
# joint_limits are identical (all joints max_velocity 180 deg/s).

gello_publisher:
  ros__parameters:
    port: "/dev/serial/by-id/usb-FTDI_USB__-__Serial_Converter_FTBEO6QK-if00-port0"
    joint_ids: [1, 2, 3, 4, 5, 6]
    # w3(마지막) 오프셋: 원래 3.142 -> 0.0 (원래값에서 pi=180deg 이동). 편한 손목
    # 자세가 UR w3=0 에 오도록. 2pi 정수배는 start_joints 오토랩(dynamixel.py:84-104)이
    # 부팅 시 start 기준으로 정규화하므로 0.0 과 6.283 은 동일 결과. 방향(sign)은 그대로.
    joint_offsets: [0.0, 1.571, 4.712, 4.712, 4.712, 3.142]  # w3 원래값=3.142; J2/J3 recalibrated after remount
    # pan(shoulder_pan) sign = +1 (ORIGINAL). This is the sign that gives the
    # CORRECT teleop base-rotation direction (flipping to -1 reverses it). The
    # GELLO base and robot base rotate in opposite senses in this physical setup,
    # so at a non-zero home the GELLO's reported pan looks "mirrored" vs the robot
    # — align by the console-5 pan NUMBER (not visually). Home at pan=0 avoids it.
    joint_signs: [1, 1, -1, 1, 1, 1]
    # NOTE: must be ALL doubles — rcl's yaml parser rejects mixed int/double arrays.
    # (gripper id 7 is round-tripped back to int inside the node.)
    gripper_config: [7.0, 210.649609375, 168.849609375]
    start_joints: [0.0, -1.57, 1.57, -1.57, -1.57, 0.0, 0.0]
    publish_rate_hz: 30.0

gello_ur_bridge:
  ros__parameters:
    # SMOOTHING FILTER (anti-vibration). "one_euro" = speed-adaptive low-pass
    # applied to the GELLO joint values: smooths HARD when the leader is nearly
    # still (kills hand tremor + Dynamixel motor noise) but opens up when you
    # move fast (little lag). This is the recommended anti-vibration path.
    # Set to "ema" to fall back to the fixed EMA + deadband below.
    filter_type: "one_euro"
    # LOWER min_cutoff (Hz) => more smoothing at rest (less vibration, a touch
    # more lag when moving slowly). Try 0.6-1.5. This is the main anti-tremor knob.
    one_euro_min_cutoff: 1.0
    # HIGHER beta => cutoff opens faster with speed => snappier on fast moves
    # (less smoothing during intentional motion). Try 1.0-5.0.
    one_euro_beta: 2.0
    # Derivative low-pass (Hz) so jitter doesn't inflate the cutoff; leave ~1.0.
    one_euro_d_cutoff: 1.0
    # --- EMA fallback params (used only when filter_type: "ema") ---
    ema_alpha: 0.4
    # Per-cycle velocity safety (real UR7e). The driver evaluates each command as
    # delta / 0.002s (500 Hz e-series servo cycle) against the 3.14159 rad/s
    # (180 deg/s) joint limit, so the safe per-cycle budget is
    # 3.14159 * 0.002 = 0.00628 rad. At publish 250 Hz two publishes can, under
    # jitter, coalesce into one 0.002s driver cycle, so the coalescing-safe cap
    # is HALF that: 0.00314 rad. max_step_rad=0.0025 => single-cycle 1.25 rad/s
    # and worst-case two-coalesce 2.5 rad/s (~20% margin under the limit).
    # Sustained teleop speed = 0.0025 * 250 = 0.625 rad/s (~36 deg/s).
    # For SNAPPIER teleop, first raise publish_rate_hz to 500 (1:1 with the
    # driver removes the 2x coalescing factor), THEN the single-cycle cap
    # becomes 0.00628 rad — do NOT raise max_step_rad past ~0.003 while at
    # 250 Hz. The bridge seeds from the robot's ACTUAL /joint_states, so there is
    # no start-up snap to absorb; this clamp only bounds slew speed.
    max_step_rad: 0.0025
    # NOISE GATE (anti-tremor). A joint only follows GELLO once the leader moves
    # more than deadband_rad from the held value, so hand tremor + Dynamixel
    # encoder/motor noise do NOT jitter the arm while you hold still. 0.0 = off.
    # 0.004 rad ~= 0.23 deg: kills typical at-rest jitter with negligible lag on
    # intentional motion. Raise (0.006-0.01) if it still shakes at rest; lower
    # (toward 0.002) if fine moves feel "sticky"/stair-stepped.
    deadband_rad: 0.004
    staleness_timeout_s: 0.5
    # SOFT-START (anti-snap ease-in). For soft_start_s seconds after EVERY
    # (re)seed — startup, operator resume, AND staleness recovery — the per-cycle
    # slew clamp ramps from ~15% up to max_step_rad, so the arm eases into closing
    # any residual gap instead of jumping to full slew from a standstill. This is
    # what bounds the "startup snap": the residual leader<->arm gap at handover is
    # closed at <= (ramped) max_step_rad*publish_rate_hz, never in one cycle.
    # 0.0 = off (full slew immediately). 0.7s validated on the real bridge
    # (ramps 0.17 -> 0.40 -> 0.625 rad/s over 0.7s).
    soft_start_s: 0.7
    # START PAUSED default. false = normal standalone behaviour (the bridge
    # streams as soon as it is seeded), which is what gripper-only / RViz / manual
    # bridge runs that load this same file expect. The INTEGRATED real teleop
    # launch (ur7e_gello_real.launch.py) OVERRIDES this to true at launch level so
    # the bridge is pre-spawned HELD and only released by gello_move_to_start's
    # ~/resume call AFTER the controller switch. Keep this false here: putting
    # true in the yaml would make every bridge that loads this file start paused
    # and never resume.
    start_paused: false
    # RESUME ALIGNMENT GATE (rad). ~/resume only releases the bridge if every joint
    # of the live GELLO agrees with the arm's ACTUAL pose within this — a sanity
    # check that the just-converged handover really is aligned before streaming.
    # INVARIANT: resume_align_tol MUST be >= chase_tol (gello_move_to_start, 0.06),
    # else a legitimately converged arm (up to chase_tol from the leader) gets its
    # resume REFUSED and teleop won't start without manual recovery. 0.08 > 0.06.
    # Raise together with chase_tol if you retune.
    resume_align_tol: 0.08
    # 250 Hz upsamples the 30 Hz GELLO stream into the 500 Hz driver cleanly
    # (2:1) so at most one new setpoint lands per servo cycle nominally.
    publish_rate_hz: 250.0
    # Robot's actual joint state used to seed the first command (prevents snap).
    joint_states_topic: "/joint_states"

gello_move_to_start:
  ros__parameters:
    source_controller: "scaled_joint_trajectory_controller"
    target_controller: "forward_position_controller"
    trajectory_duration: 5.0
    arrival_tolerance: 0.05
    # --- Convergence-gated handover ("gello" mode) -----------------------------
    # The leader is a MOVING target, so instead of one blind trajectory to a
    # frozen snapshot (which snapped when streaming began because the leader had
    # drifted) the node CHASES the live GELLO pose and only hands over once the
    # arm's ACTUAL pose agrees with the LIVE leader within chase_tol on every
    # joint, sustained chase_dwell_s. All defaults below are field-proven on the
    # real stack.
    #
    # Per-joint agreement (rad) required at handover. 0.06 rad ~= 3.4 deg; the
    # residual is closed by the bridge's soft-started, rate-limited slew, so it is
    # snap-free (the original snap was 0.15-0.25 rad at full speed from a dead stop).
    # INVARIANT: chase_tol MUST be > arrival_tolerance (0.05 above). The catch-up
    # trajectory reports SUCCEEDED as soon as the arm is within arrival_tolerance,
    # so a real servo settling in the (chase_tol, arrival_tolerance] dead band would
    # satisfy the trajectory yet NEVER satisfy a tighter gate -> the chase livelocks
    # to chase_timeout_s and teleop never starts (the fake-hardware mock hides this
    # by arriving exactly). The node auto-raises chase_tol with a warning if this is
    # violated. After real-robot calibration you MAY tighten BOTH together (e.g.
    # arrival 0.03 / chase_tol 0.04) if the arm reliably settles that close.
    chase_tol: 0.06
    # The agreement must HOLD this long (median-of-5 filtered) before handover, so
    # a lone Dynamixel spike can't falsely pass the gate.
    chase_dwell_s: 0.4
    # Velocity budget (rad/s) that SIZES each catch-up trajectory from the measured
    # gap: T = max(gap / chase_v_budget, min_traj_duration). No upper clamp — a big
    # gap gets a proportionally LONGER (not faster) move, so the JTC spline peak
    # stays well under the 3.14 rad/s protective-stop limit.
    chase_v_budget: 0.5
    # Floor on each catch-up trajectory duration (s) so tiny gaps still move
    # smoothly rather than as a near-instant step.
    min_traj_duration: 0.5
    # Per-joint HARD refuse (rad): never auto-chase a gap larger than this. The
    # gap is a CIRCULAR (branch-cut-aware) distance (angle_utils.py), so its max
    # possible value is pi (~3.1416) — a joint whose neutral sits near +/-pi
    # (e.g. wrist_3 rotated ~180 deg for an ergonomic-leader/camera-up-follower
    # rig) is never falsely flagged as a huge gap. 4.0 is ABOVE that max, so this
    # backstop never trips: every gap, however large, is auto-chased rather than
    # refused. Lower this (e.g. ~3.0) if you want a near-pi gross mispose to
    # still be refused and require a manual re-pose instead.
    chase_hard_limit: 4.0
    # Leader "quasi-still" gate (rad/s, s). After the FIRST catch-up, the node
    # REFUSES to dispatch another one until the live leader's per-joint speed over
    # the last chase_still_window_s has dropped to <= chase_still_speed. This
    # prevents the arm from autonomously SHADOWING a never-settling leader with
    # back-to-back catch-ups for up to chase_timeout_s (streaming is not authorized
    # yet — the gate catches up, it does not track). Values match the node's own
    # defaults (0.1 rad/s, 0.3 s). Tune chase_still_speed DOWN if real Dynamixel
    # tremor at rest (roughly 0.003 rad noise band) causes false "still moving" holds.
    chase_still_speed: 0.1
    chase_still_window_s: 0.3
    # Overall convergence time budget (s); on never-settle the node times out and
    # exits 1 (fail-safe, no switch). <=0 => wait forever.
    chase_timeout_s: 30.0
    # A GELLO sample older than this (s) is STALE: a dead/frozen leader stream must
    # never count as "still" and pass the dwell (that would re-open the snap on
    # recovery). The convergence gate clears its dwell whenever the sample is not
    # fresh, so a dead stream cannot hand over — it times out instead.
    gello_staleness_s: 0.5
    # Handshake style (override at launch with start_mode:=..., or env
    # START_MODE=init_align via run_ur7e_gello_real.sh):
    #   "gello"      : convergence-gated chase — arm follows the LIVE leader with
    #                  gap-sized catch-ups, streams only once caught up within
    #                  chase_tol (below), sustained chase_dwell_s.
    #   "init_align" : INTERACTIVE, operator-gated. Robot moves to the FIXED
    #                  init_pose below only after you authorize GATE 1
    #                  (ros2 service call /gello_move_to_start/proceed). Then YOU
    #                  align the GELLO leader to it and authorize GATE 2 (proceed);
    #                  the node computes per-joint |GELLO-init| and hands over only
    #                  if all within alignment_tolerance. If a joint is off it
    #                  REPORTS which and refuses; ~/override_follow accepts an
    #                  offset only within alignment_hard_limit. Safer: first motion
    #                  is to a known pose, handover matched, no silent big follow.
    start_mode: "gello"
    # Fixed neutral/home pose (rad, UR joint order: pan, lift, elbow, w1, w2, w3)
    # used only in init_align mode. pan=-1.5708(-pi/2): arm faces the UR 'base'
    # (pendant) frame +y (0,1) — the frame the operator reads on the pendant.
    # base(pendant) facing by pan: 0=>-x, -1.5708=>+y, +1.5708=>-y, pi=>+x.
    # (base_link/RViz is 180deg about Z from this: pan=0 there is +x.)
    init_pose: [1.5708, -1.57, 1.57, -1.57, -1.57, 0.0]
    alignment_tolerance: 0.2    # per-joint rad: within this on all joints -> proceed hands over
    alignment_hard_limit: 0.5   # per-joint rad: override_follow refused beyond this (e.g. big base offset)
    alignment_timeout: 0.0      # <=0 => wait forever for the operator at a gate

# Robotiq 2F-85 Modbus gripper driver (node name 'robotiq_gripper').
# Driven via Modbus RTU over the UR RS485 tool-communication line.
# serial_port DEFAULT below is "" = DIRECT TCP :54321, which is the GRIPPER-ONLY
# path (ur7e_gripper_only.launch.py, no arm/External Control — the gripper node
# is the sole :54321 owner). The INTEGRATED real teleop launch
# (ur7e_gello_real.launch.py) OVERRIDES serial_port to /tmp/ttyUR: there the arm
# driver runs with use_tool_communication:=true + tool_voltage:=24, so the DRIVER
# powers the tool (pendant Installation-tab voltage would be cut by External
# Control) and owns :54321 via its socat forwarder, which the gripper SHARES.
# robot_ip is injected by the launch file (not set here).
robotiq_gripper:
  ros__parameters:
    serial_port: ""          # "" => direct TCP :54321 (gripper-only); real launch overrides to /tmp/ttyUR
    speed: 150               # Robotiq speed (conservative default)
    force: 50                # Robotiq force (~mid-range, avoids crushing)
    connect_on_start: true
    activate_on_connect: true  # triggers auto-cal open/close sweep — keep fingers clear
    status_rate_hz: 5.0
    command_rate_hz: 20.0    # streaming ~/command_percent rate-limit toward the bus
    command_deadband: 0.01   # percent-unit deadband on streaming writes

# GELLO gripper -> command_percent bridge (node name 'gello_gripper_bridge').
# Reads the GELLO width topic (0=OPEN..1=CLOSED) and publishes
# /robotiq_gripper/command_percent (0=open..1=closed) with the SAME convention.
gello_gripper_bridge:
  ros__parameters:
    invert: false            # SAFETY: MUST stay false for this robot (crush hazard if true)
    deadband: 0.02           # 2% deadband suppresses at-rest gripper-axis jitter
    ema_alpha: 1.0           # EMA off (no lag); set 0.5 if the gripper chatters
    clamp_min: 0.0
    clamp_max: 1.0
    publish_rate_hz: 30.0    # informational; node publishes on receive (~30 Hz GELLO rate)
